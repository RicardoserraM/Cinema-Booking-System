<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketFlick - Reserve Section</title>
    <!-- WEB ICON -->
    <link rel="icon" href="./src/assets/icons/PNGs/favicon.png" type="image/png">
</head>

<body class="reserve-page">

    <main>
        <header id="header-title">
            <nav id="top-nav" aria-label="Barra de navegación principal - Top NavBar">
                <!-- Botones de navegación -->
                <div class="ctn-nav-assets">
                    <a href="./index.html" target="_self">
                        <svg width="30px" height="30px" viewBox="0 0 24 24" fill="none"
                            xmlns="http://www.w3.org/2000/svg">
                            <path d="M6 12H18M6 12L11 7M6 12L11 17" stroke="#ffffff" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </a>

                    <img src="./src/assets/icons/PNGs/logo.png" alt="Logo" class="logo">

                    <div class="ctn-nav-btns">
                        <!-- Ubicación -->
                        <a href="#">
                            <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-map-pin-icon lucide-map-pin">
                                <path
                                    d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0" />
                                <circle cx="12" cy="10" r="3" />
                            </svg>
                        </a>
                    </div>

                </div>
            </nav>
        </header>

        <div class="reserve-layout">
            <div class="reserve-main-col">
                <section class="ctn-info-pelicula-seleccionada">
                    <div class="pelicula-seleccionada"></div>
                    <article class="info-pelicula-seleccionada">
                        <h2>Super Mario Galaxy</h2>
                        <p>IMAX 2D &bull; <span>2h 49m</span> &bull; Sci-Fi</p>
                        <div class="ctn-age-valoration">
                            <span>U/A 13+</span>
                            <div class="ctn-valoration-info">
                                <img src="./src/assets/icons/PNGs/star.png" alt="valoracion" class="valoration-icon">
                                <span>9.2</span>
                            </div>
                        </div>
                    </article>
                </section>

                <div class="reserve-seats-panel">
                    <section class="ctn-select-date">
                        <span>SELECT DATE</span>
                        <div class="ctn-dates">
                            <button type="button" class="date">
                                <span>OCT</span>
                                <span>24</span>
                                <span>THU</span>
                            </button>
                            <button type="button" class="date">
                                <span>OCT</span>
                                <span>25</span>
                                <span>FRY</span>
                            </button>
                            <button type="button" class="date">
                                <span>OCT</span>
                                <span>26</span>
                                <span>SAT</span>
                            </button>
                            <button type="button" class="date">
                                <span>OCT</span>
                                <span>27</span>
                                <span>SUN</span>
                            </button>
                        </div>
                    </section>

                    <section class="ctn-showtimes">
                        <span>SHOW TIME</span>
                        <div class="ctn-schedules">
                            <button type="button" class="time">10:30 AM</button>
                            <button type="button" class="time">01:45 PM</button>
                            <button type="button" class="time">05:00 PM</button>
                            <button type="button" class="time">09:30 PM</button>
                        </div>
                    </section>

                    <section class="ctn-screen">
                        <div class="screen-glow"></div>
                        <div class="screen-line"></div>
                        <span>SCREEN THIS WAY</span>
                    </section>

                    <section class="ctn-seat-selection">
                        <div class="ctn-top-seat">
                            <button type="button" class="seat" data-seat="A1" id="seat-A1" aria-label="Asiento A1"><span class="seat-label">A1</span></button>
                            <button type="button" class="seat" data-seat="A2" id="seat-A2" aria-label="Asiento A2"><span class="seat-label">A2</span></button>
                            <button type="button" class="seat" data-seat="A3" id="seat-A3" aria-label="Asiento A3"><span class="seat-label">A3</span></button>
                            <button type="button" class="seat" data-seat="A4" id="seat-A4" aria-label="Asiento A4"><span class="seat-label">A4</span></button>
                            <button type="button" class="seat" data-seat="A5" id="seat-A5" aria-label="Asiento A5"><span class="seat-label">A5</span></button>
                            <button type="button" class="seat" data-seat="A6" id="seat-A6" aria-label="Asiento A6"><span class="seat-label">A6</span></button>
                            <button type="button" class="seat" data-seat="A7" id="seat-A7" aria-label="Asiento A7"><span class="seat-label">A7</span></button>

                            <button type="button" class="seat" data-seat="A9" id="seat-A9" aria-label="Asiento A9"><span class="seat-label">A9</span></button>
                            <button type="button" class="seat" data-seat="A10" id="seat-A10" aria-label="Asiento A10"><span class="seat-label">A10</span></button>
                            <button type="button" class="seat" data-seat="B1" id="seat-B1" aria-label="Asiento B1"><span class="seat-label">B1</span></button>
                            <button type="button" class="seat" data-seat="B2" id="seat-B2" aria-label="Asiento B2"><span class="seat-label">B2</span></button>
                            <button type="button" class="seat" data-seat="B3" id="seat-B3" aria-label="Asiento B3"><span class="seat-label">B3</span></button>
                            <button type="button" class="seat" data-seat="B4" id="seat-B4" aria-label="Asiento B4"><span class="seat-label">B4</span></button>
                            <button type="button" class="seat" data-seat="B5" id="seat-B5" aria-label="Asiento B5"><span class="seat-label">B5</span></button>
                            <button type="button" class="seat" data-seat="B6" id="seat-B6" aria-label="Asiento B6"><span class="seat-label">B6</span></button>
                            <button type="button" class="seat" data-seat="B7" id="seat-B7" aria-label="Asiento B7"><span class="seat-label">B7</span></button>
                            <button type="button" class="seat" data-seat="B8" id="seat-B8" aria-label="Asiento B8"><span class="seat-label">B8</span></button>
                            <button type="button" class="seat" data-seat="B9" id="seat-B9" aria-label="Asiento B9"><span class="seat-label">B9</span></button>
                            <button type="button" class="seat" data-seat="B10" id="seat-B10" aria-label="Asiento B10"><span class="seat-label">B10</span></button>
                            <button type="button" class="seat" data-seat="C1" id="seat-C1" aria-label="Asiento C1"><span class="seat-label">C1</span></button>
                            <button type="button" class="seat" data-seat="C2" id="seat-C2" aria-label="Asiento C2"><span class="seat-label">C2</span></button>
                            <button type="button" class="seat" data-seat="C3" id="seat-C3" aria-label="Asiento C3"><span class="seat-label">C3</span></button>
                            <button type="button" class="seat" data-seat="C4" id="seat-C4" aria-label="Asiento C4"><span class="seat-label">C4</span></button>
                            <button type="button" class="seat" data-seat="C5" id="seat-C5" aria-label="Asiento C5"><span class="seat-label">C5</span></button>
                            <button type="button" class="seat" data-seat="C6" id="seat-C6" aria-label="Asiento C6"><span class="seat-label">C6</span></button>
                            <button type="button" class="seat" data-seat="C7" id="seat-C7" aria-label="Asiento C7"><span class="seat-label">C7</span></button>
                            <button type="button" class="seat" data-seat="C8" id="seat-C8" aria-label="Asiento C8"><span class="seat-label">C8</span></button>
                            <button type="button" class="seat" data-seat="C9" id="seat-C9" aria-label="Asiento C9"><span class="seat-label">C9</span></button>
                            <button type="button" class="seat" data-seat="C10" id="seat-C10" aria-label="Asiento C10"><span class="seat-label">C10</span></button>
                            <button type="button" class="seat" data-seat="D1" id="seat-D1" aria-label="Asiento D1"><span class="seat-label">D1</span></button>
                            <button type="button" class="seat" data-seat="D2" id="seat-D2" aria-label="Asiento D2"><span class="seat-label">D2</span></button>
                            <button type="button" class="seat" data-seat="D3" id="seat-D3" aria-label="Asiento D3"><span class="seat-label">D3</span></button>
                            <button type="button" class="seat" data-seat="D4" id="seat-D4" aria-label="Asiento D4"><span class="seat-label">D4</span></button>
                            <button type="button" class="seat" data-seat="D5" id="seat-D5" aria-label="Asiento D5"><span class="seat-label">D5</span></button>
                            <button type="button" class="seat" data-seat="D6" id="seat-D6" aria-label="Asiento D6"><span class="seat-label">D6</span></button>
                            <button type="button" class="seat" data-seat="D7" id="seat-D7" aria-label="Asiento D7"><span class="seat-label">D7</span></button>
                            <button type="button" class="seat" data-seat="D8" id="seat-D8" aria-label="Asiento D8"><span class="seat-label">D8</span></button>
                            <button type="button" class="seat" data-seat="D9" id="seat-D9" aria-label="Asiento D9"><span class="seat-label">D9</span></button>
                            <button type="button" class="seat" data-seat="D10" id="seat-D10" aria-label="Asiento D10"><span class="seat-label">D10</span></button>
                        </div>

                        <div class="ctn-bottom-seat">
                            <button type="button" class="seat" data-seat="E1" id="seat-E1" aria-label="Asiento E1"><span class="seat-label">E1</span></button>
                            <button type="button" class="seat" data-seat="E2" id="seat-E2" aria-label="Asiento E2"><span class="seat-label">E2</span></button>
                            <button type="button" class="seat" data-seat="E3" id="seat-E3" aria-label="Asiento E3"><span class="seat-label">E3</span></button>
                            <button type="button" class="seat" data-seat="E4" id="seat-E4" aria-label="Asiento E4"><span class="seat-label">E4</span></button>

                            <button type="button" class="seat" data-seat="E8" id="seat-E8" aria-label="Asiento E8"><span class="seat-label">E8</span></button>
                            <button type="button" class="seat" data-seat="F1" id="seat-F1" aria-label="Asiento F1"><span class="seat-label">F1</span></button>
                            <button type="button" class="seat" data-seat="F2" id="seat-F2" aria-label="Asiento F2"><span class="seat-label">F2</span></button>
                            <button type="button" class="seat" data-seat="F3" id="seat-F3" aria-label="Asiento F3"><span class="seat-label">F3</span></button>
                            <button type="button" class="seat" data-seat="F4" id="seat-F4" aria-label="Asiento F4"><span class="seat-label">F4</span></button>
                            <button type="button" class="seat" data-seat="F5" id="seat-F5" aria-label="Asiento F5"><span class="seat-label">F5</span></button>
                            <button type="button" class="seat" data-seat="F6" id="seat-F6" aria-label="Asiento F6"><span class="seat-label">F6</span></button>
                            <button type="button" class="seat" data-seat="F7" id="seat-F7" aria-label="Asiento F7"><span class="seat-label">F7</span></button>
                            <button type="button" class="seat" data-seat="F8" id="seat-F8" aria-label="Asiento F8"><span class="seat-label">F8</span></button>
                        </div>

                        <div class="ctn-status">
                            <div class="status-item">
                                <div class="status-indicator available"></div>
                                <span>Available</span>
                            </div>
                            <div class="status-item">
                                <div class="status-indicator selected"></div>
                                <span>Selected</span>
                            </div>
                            <div class="status-item">
                                <div class="status-indicator reserved"></div>
                                <span>Reserved</span>
                            </div>
                        </div>
                    </section>
                </div>
            </div>

            <aside class="reserve-sidebar">
                <section class="ctn-resume-total">
                    <article class="ctn-total-price">
                        <span>Total price</span>
                        <span id="total-amount">$0.00</span>
                        <p><span id="num-seats">0</span> Seats Selected</p>
                    </article>
                    <a href="./finish-booking.html" class="btn-buy">Confirm</a>
                </section>
            </aside>
        </div>
    </main>

    <script type="module" src="./src/reserve.js"></script>
</body>

</html>
