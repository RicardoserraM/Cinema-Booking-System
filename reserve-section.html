<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketFlick - Reserve Section</title>
    <!-- WEB ICON -->
    <link rel="icon" href="./src/assets/icons/PNGs/favicon.png" type="image/png">
</head>

<body>

    <main>
        <header id="header-title">
            <nav id="top-nav" aria-label="Barra de navegación principal - Top NavBar">
                <!-- Botones de navegación -->
                <div class="ctn-nav-assets">
                    <a href="./index.html" target="_self">
                        <svg width="30px" height="30px" viewBox="0 0 24 24" fill="none"
                            xmlns="http://www.w3.org/2000/svg">
                            <path d="M6 12H18M6 12L11 7M6 12L11 17" stroke="#ffffff" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </a>

                    <img src="./src/assets/icons/PNGs/logo.png" alt="Logo" class="logo">

                    <div class="ctn-nav-btns">
                        <!-- Ubicación -->
                        <a href="#">
                            <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-map-pin-icon lucide-map-pin">
                                <path
                                    d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0" />
                                <circle cx="12" cy="10" r="3" />
                            </svg>
                        </a>
                    </div>

                </div>
            </nav>
        </header>

        <section class="ctn-info-pelicula-seleccionada">
            <div class="pelicula-seleccionada"></div>
            <article class="info-pelicula-seleccionada">
                <h2>Super Mario Galaxy</h2>
                <p>IMAX 2D &bull; <span>2h 49m</span> &bull; Sci-Fi</p>
                <div class="ctn-age-valoration">
                    <span>U/A 13+</span>
                    <div class="ctn-valoration-info">
                        <img src="./src/assets/icons/PNGs/star.png" alt="valoracion" class="valoration-icon">
                        <span>9.2</span>
                    </div>
                </div>
            </article>
        </section>

        <section class="ctn-select-date">
            <span>SELECT DATE</span>
            <div class="ctn-dates">
                <button type="button" class="date">
                    <span>OCT</span>
                    <span>24</span>
                    <span>THU</span>
                </button>
                <button type="button" class="date">
                    <span>OCT</span>
                    <span>25</span>
                    <span>FRY</span>
                </button>
                <button type="button" class="date">
                    <span>OCT</span>
                    <span>26</span>
                    <span>SAT</span>
                </button>
                <button type="button" class="date">
                    <span>OCT</span>
                    <span>27</span>
                    <span>SUN</span>
                </button>
            </div>
        </section>

        <section class="ctn-showtimes">
            <span>SHOW TIME</span>
            <div class="ctn-schedules">
                <button type="button" class="time">10:30 AM</button>
                <button type="button" class="time">01:45 PM</button>
                <button type="button" class="time">05:00 PM</button>
                <button type="button" class="time">09:30 PM</button>
            </div>
        </section>

        <section class="ctn-screen">
            <div class="screen-line"></div>
            <span>SCREEN THIS WAY</span>
        </section>

        <section class="ctn-seat-selection">
            <div class="ctn-top-seat">
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
            </div>

            <div class="ctn-bottom-seat">
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
                <button type="button" class="seat"></button>
            </div>

            <div class="ctn-status">
                <div class="status-item">
                    <div class="status-indicator available"></div>
                    <span>Available</span>
                </div>
                <div class="status-item">
                    <div class="status-indicator selected"></div>
                    <span>Selected</span>
                </div>
                <div class="status-item">
                    <div class="status-indicator reserved"></div>
                    <span>Reserved</span>
                </div>
            </div>
        </section>

        <section class="ctn-resume-total">
            <article class="ctn-total-price">
                <span>Total price</span>
                <span id="total-amount">$0.00</span>
                <p><span id="num-seats">0</span> Seats Selected</p>
            </article>
            <a href="./finish-booking.html" class="btn-buy">Confirm</a>
        </section>
    </main>

    <div id="app"></div>
    <script type="module" src="./src/reserve.js"></script>
</body>

</html>
