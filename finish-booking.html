<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketFlick - Reserva Finalizada</title>
    <!-- ICON -->
    <link rel="icon" href="./src/assets/icons/PNGs/favicon.png" type="image/png">
</head>

<body>
    <main class="main-finish-booking">
        <article class="ctn-aviso-finish-booking">
            <div class="checkmark-container">
                <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                    <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none" />
                    <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8" />
                </svg>
            </div>

            <h2 class="success-title">¡Tu reserva se ha realizado con éxito!</h2>
            <p class="success-subtitle">Gracias por elegir TicketFlick. Tu ticket está listo.</p>

            <button type="button" class="btn-download-ticket" id="btn-download-ticket">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                    class="download-icon">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="7 10 12 15 17 10" />
                    <line x1="12" y1="15" x2="12" y2="3" />
                </svg>
                Descargar ticket
            </button>

            <div class="ctn-finish-actions">
                <a href="./index.html" class="btn-home">Volver al inicio</a>
            </div>
        </article>
    </main>
    <div id="app"></div>
    <script type="module" src="./src/finish-booking.js"></script>
</body>

</html>
